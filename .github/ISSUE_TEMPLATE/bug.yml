name: 🐞 Πρόβλημα / Bug
description: Κάτι δεν δουλεύει όπως θα έπρεπε.
title: "[Πρόβλημα] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Μην ανεβάζεις εδώ το export σου ή usernames άλλων.** Τα issues είναι δημόσια.
        ⚠️ **Do not upload your export or other people's usernames here.** Issues are public.
  - type: textarea
    id: what
    attributes:
      label: Τι έγινε; / What happened?
      description: Τι περίμενες να γίνει και τι έγινε τελικά.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Βήματα / Steps
      description: Τι πάτησες για να εμφανιστεί το πρόβλημα (προαιρετικό).
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Έκδοση / Version
      description: Φαίνεται στο κάτω μέρος της σελίδας της εφαρμογής.
      placeholder: π.χ. v1.5.1
    validations:
      required: false
  - type: dropdown
    id: device
    attributes:
      label: Συσκευή / Device
      options:
        - Κινητό Android / Android phone
        - iPhone
        - Υπολογιστής / Computer
        - Άλλο / Other
    validations:
      required: false
